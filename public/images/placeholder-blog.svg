<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Blog article placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1a1b"/>
      <stop offset="1" stop-color="#2d2224"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9534a"/>
      <stop offset="1" stop-color="#b8372f"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <circle cx="1080" cy="120" r="260" fill="#d9534a" fill-opacity="0.07"/>
  <circle cx="160" cy="640" r="200" fill="#d9534a" fill-opacity="0.05"/>

  <!-- article card -->
  <g transform="translate(400 130)">
    <rect width="480" height="460" rx="24" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
    <rect x="40" y="44" width="150" height="14" rx="7" fill="url(#accent)"/>
    <rect x="40" y="92" width="400" height="26" rx="8" fill="#ffffff" fill-opacity="0.85"/>
    <rect x="40" y="134" width="300" height="26" rx="8" fill="#ffffff" fill-opacity="0.85"/>
    <rect x="40" y="196" width="400" height="12" rx="6" fill="#ffffff" fill-opacity="0.28"/>
    <rect x="40" y="224" width="400" height="12" rx="6" fill="#ffffff" fill-opacity="0.28"/>
    <rect x="40" y="252" width="340" height="12" rx="6" fill="#ffffff" fill-opacity="0.28"/>
    <rect x="40" y="298" width="400" height="90" rx="12" fill="#ffffff" fill-opacity="0.07"/>
    <path d="M62 366l40-38 28 24 34-40 52 54z" fill="#d9534a" fill-opacity="0.55"/>
    <circle cx="378" cy="328" r="12" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="52" cy="424" r="14" fill="url(#accent)"/>
    <rect x="76" y="418" width="110" height="12" rx="6" fill="#ffffff" fill-opacity="0.3"/>
