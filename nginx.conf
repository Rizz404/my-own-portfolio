server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: kalau request bukan file statis yang ada,
    # balikin ke index.html biar vue-router yang handle routing-nya
    location / {
        try_files $uri $uri/ /index.html;
    }

    # asset hasil build vite udah di-hash namanya (contenthash), aman di-cache lama
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
